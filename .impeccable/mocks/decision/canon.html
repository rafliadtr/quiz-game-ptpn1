<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#fff;color:#2E1B19;font-family:Barlow,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.top{background:#1E7B3C;color:#fff;padding:16px;display:flex;justify-content:space-between;font:600 16px Barlow}
.q{padding:26px 20px;text-align:center;font:700 26px/1.15 Barlow}
.ring{margin:0 auto 18px;width:84px;height:84px;border-radius:50%;background:conic-gradient(#F39321 0 62%,#e8ece5 0);display:grid;place-items:center}
.ring span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 30px Barlow}
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.t{border-radius:10px;color:#fff;padding:16px;font:700 18px/1.2 Barlow;display:flex;align-items:flex-end}
.t:nth-child(1){background:#1E7B3C}.t:nth-child(2){background:#2E72B8}.t:nth-child(3){background:#F39321;color:#2E1B19}.t:nth-child(4){background:#6E2A26}
</style></head><body>
<div class="top"><span>Soal 5/10</span><span>420 poin</span></div>
<div class="q">Siapa Kepala Sub Divisi Manajemen Talenta dan Perencanaan Tenaga Kerja?</div>
<div class="ring"><span>9</span></div>
<div class="tiles"><div class="t">Teuku Novika Yunanda</div><div class="t">Yunanto Nurhascaryo</div><div class="t">Farhan</div><div class="t">Henny Mailena Siregar</div></div>
</body></html>
