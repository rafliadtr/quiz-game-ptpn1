<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--putih:#fff;--abu:#F2F6EE;--hijau:#1E7B3C;--jingga:#F39321;--tinta:#2E1B19}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:var(--putih);color:var(--tinta);font-family:Barlow,sans-serif;overflow:hidden}
.top{background:var(--hijau);height:300px;position:relative;color:#fff;padding:16px}
.top p{font:600 15px Barlow;display:flex;justify-content:space-between}
.top p b{font-size:26px}
svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.card{margin:-26px 16px 0;position:relative;background:#fff;border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(30,40,30,.14)}
.card small{font:600 13px Barlow;color:#6b625f}
.card h1{margin-top:6px;font:700 25px/1.15 Barlow}
.bar{margin-top:14px;height:6px;background:#e3e9df;border-radius:3px}.bar i{display:block;width:58%;height:100%;background:var(--jingga);border-radius:3px}
.opts{margin:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--abu);border-radius:12px;padding:14px;min-height:92px;font:600 16px/1.25 Barlow}
.opt b{display:block;color:var(--hijau);font-size:13px;margin-bottom:6px}
</style></head><body>
<div class="top"><p><span>DPSB · soal 5 dari 10</span><b>420</b></p>
<svg width="240" height="230" viewBox="0 0 240 230"><path d="M120 230 C118 170 122 120 120 60" stroke="#fff" stroke-width="6" fill="none"/>
<path d="M120 70 C112 40 118 18 132 4 C140 30 136 54 120 70Z" fill="#F39321"/>
<path d="M120 150 C80 160 40 140 20 100 C60 92 100 110 120 150Z" fill="#fff"/>
<path d="M121 120 C160 130 200 110 220 70 C180 62 140 82 121 120Z" fill="#fff"/>
<path d="M120 190 C90 200 60 190 44 164 C76 158 104 168 120 190Z" fill="#fff" opacity=".45"/></svg></div>
<div class="card"><small>Siapa yang menjabat</small><h1>Kepala Sub Divisi Manajemen Talenta dan Perencanaan Tenaga Kerja?</h1><div class="bar"><i></i></div></div>
<div class="opts"><div class="opt"><b>A</b>Teuku Novika Yunanda</div><div class="opt"><b>B</b>Yunanto Nurhascaryo</div><div class="opt"><b>C</b>Farhan</div><div class="opt"><b>D</b>Henny Mailena Siregar</div></div>
</body></html>
