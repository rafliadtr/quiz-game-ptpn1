<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--putih:#fff;--muda:#CFE6D3;--hijau:#1E7B3C;--tua:#0F3A1E;--jingga:#F39321}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:var(--putih);color:var(--tua);font-family:'Pixelify Sans',monospace;overflow:hidden;padding:16px}
.screen{background:var(--muda);border:8px solid var(--hijau);padding:14px;height:560px;background-image:repeating-conic-gradient(var(--muda) 0 25%,#c3dcc7 0 50%);background-size:8px 8px}
.hud{display:flex;justify-content:space-between;font:700 18px 'Silkscreen';background:var(--tua);color:var(--muda);padding:8px 10px}
.hp{display:flex;gap:4px;margin:10px 0}.hp i{width:22px;height:12px;background:var(--hijau)}.hp i.off{background:#9fc0a6}
.box{background:#fff;border:4px solid var(--tua);padding:12px;margin-top:8px;font:500 19px/1.3 'Pixelify Sans'}
.menu{margin-top:12px;background:#fff;border:4px solid var(--tua)}
.menu div{padding:10px 12px;font:500 17px 'Pixelify Sans';border-bottom:2px dashed #9fc0a6}
.menu div.sel{background:var(--tua);color:#fff}
.menu div.sel::before{content:'▶ ';color:var(--jingga)}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.dpad{width:110px;height:110px;background:var(--hijau);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
.btns{display:flex;gap:16px}.btns span{width:62px;height:62px;border-radius:50%;background:var(--jingga);display:grid;place-items:center;font:700 22px 'Silkscreen';color:var(--tua)}
</style></head><body>
<div class="screen"><div class="hud"><span>DPSB</span><span>05/10</span><span>420</span></div>
<div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div>
<div class="box">Siapa Kepala Sub Divisi Manajemen Talenta dan Perencanaan Tenaga Kerja?</div>
<div class="menu"><div class="sel">Teuku Novika Yunanda</div><div>Yunanto Nurhascaryo</div><div>Farhan</div><div>Henny Mailena Siregar</div></div></div>
<div class="pad"><div class="dpad"></div><div class="btns"><span>B</span><span>A</span></div></div>
</body></html>
